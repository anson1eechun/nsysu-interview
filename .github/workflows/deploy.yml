name: Deploy slides to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: |
          REPO="${{ github.event.repository.name }}"
          # <user>.github.io repos are served from the domain root; project repos from /<repo>/.
          if [[ "$REPO" == *.github.io ]]; then BASE="/"; else BASE="/$REPO/"; fi
          OPEN_SLIDE_BASE="$BASE" npm run build
      - name: SPA fallbacks for deep links
        run: |
          cp dist/index.html dist/404.html
          for deck in nsysu-interview nsysu-interview-7a; do
            mkdir -p "dist/s/$deck/presenter"
            cp dist/index.html "dist/s/$deck/index.html"
            cp dist/index.html "dist/s/$deck/presenter/index.html"
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
